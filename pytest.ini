[pytest]
testpaths = tests

# Par defaut, `pytest` ne lance que les tests qui tournent sans infrastructure
# externe -- c'est la suite de reference (celle de la CI). Les deux marqueurs
# ci-dessous isolent les tests qui exigent autre chose que Python :
#   pytest -m mysql   -> tests necessitant un serveur MySQL joignable
#   pytest -m e2e     -> tests navigateur Playwright (serveur deja demarre)
#   pytest -m ""      -> tout, sans exclusion
addopts = -m "not mysql and not e2e"

markers =
    mysql: necessite un serveur MySQL joignable (non lance par defaut)
    e2e: test de bout en bout Playwright, necessite un serveur demarre et un navigateur (non lance par defaut)

filterwarnings =
    ignore::DeprecationWarning:passlib.*
