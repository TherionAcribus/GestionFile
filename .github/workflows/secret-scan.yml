name: secret-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Règles par défaut + règles maison (dont les jetons OAuth Spotify,
          # que gitleaks ne détecte pas nativement). Les fuites historiques
          # déjà rotées sont acquittées dans .gitleaksignore.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
