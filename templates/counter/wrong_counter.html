<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Comptoir {{ counter_id }}</title>
    <script src="{{ url_for('static', filename='js/libs/htmx.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/libs/materialize.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/counter.css') }}">
</head>
<body>
    <h1>Erreur identifiant comptoir</h1>

    <div>Aucun comptoir ne possède l'indentifiant {{ counter_id }}. Peut-être vouliez vous accéder à la page d'un des comptoirs suivants :</div>
    <ul>
    {% for counter in counters %}
        <li>
            <a href="/counter/{{ counter.id }}">{{ counter.name }} </a>
        </li>
    {% endfor %}
    </ul>


</body>
</html>
