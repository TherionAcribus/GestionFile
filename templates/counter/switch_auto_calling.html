<div class="switch">
    <span>Appel automatique des patients</span>
    <label>
    Non
    <input id="switch_auto_calling" 
            type="checkbox"
            {% if auto_calling %} checked {% endif %}
            hx-post="/counter/update_switch_auto_calling"
            hx-target="#invisible"
            hx-vals='{"counter_id": {{ counter.id }}}'
            data-param-value="#switch_auto_calling@checked">
    <span class="lever"></span>
    Oui
    </label>
</div>
