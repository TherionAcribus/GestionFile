<div id="div_conclusion" class="div_summary">

  <!-- Contenu de confirmation "normal" : masqué pendant l'impression et en cas
       d'échec (l'overlay #print_status_overlay prend le relais). -->
  <div id="conclusion_normal">

    <div id="conclusion_text" class="div_text_summary">
        <p class="text_summary">
            {{page_patient_confirmation_message}}
        </p>
    </div>

    <div class="div_qr_plus_buttons" 
    {% if not page_patient_display_qrcode %}
        style="display: flex; justify-content: center;"
    {% endif %}
    >

        {% if page_patient_display_qrcode %}
        <div id="div_qr_code" class="div_qr_code">
            <img src="{{ url_for('static', filename='qr_patients/' ~ image_name_qr) }}" alt="QR Code">
        </div>
        {% endif %}

        <div class="div_validation_buttons"
        {% if not page_patient_display_qrcode %}
            style="margin-left: 0;"
        {% endif %}
        >
            
            <div
                id="print_btn"
                {% if not reprint %} style="display: none;" {% endif %} 
                class="div_validation_one_button">
                <p class="validation_button">{{ page_patient_interface_done_print }}</p>
            </div>

            <div
                id="prolong_btn"
                {% if not reprint %} style="display: none;" {% endif %} 
                class="div_validation_one_button">
                <p class="validation_button">{{page_patient_interface_done_extend}}</p>
            </div>

            <div
                id="cancel_btn" 
                class="div_validation_one_button"
                hx-get="/patient/cancel_patient"
                hx-target="#div_buttons_parents">
                <p class="validation_button">{{page_patient_interface_done_back}}</p>
            </div>

        </div>
    </div>

    <div id="timer_container">
        <div id="timer_gauge" data-duration="{{page_patient_end_timer}}"></div>
    </div>

  </div><!-- /#conclusion_normal -->

  <!-- Overlay d'état d'impression (impression en cours / échec + choix).
       Affiché/masqué et rempli par patients.js (runPrintFlow). -->
  <div id="print_status_overlay"
       style="display:none; flex-direction:column; align-items:center; justify-content:center; gap:24px; text-align:center; min-height:40vh;">
      <div id="print_status_message" class="div_text_summary"></div>
      <div id="print_status_buttons" class="div_validation_buttons"></div>
  </div>

</div>

<div id="print_data" print-ticket="{{ print_ticket }}" data-print="{{ print_data | escape }}" data-print-job-id="{{ print_job_id if print_job_id else '' }}" data-call-number="{{ call_number }}" style="display: none;"></div>

<!-- Libellés (traduits) du flux d'impression, lus par patients.js. -->
<script id="print_ui_labels" type="application/json">{{ print_ui_labels | tojson }}</script>

<script src="{{ url_for('static', filename='js/patient_conclusion.js') }}"></script>
