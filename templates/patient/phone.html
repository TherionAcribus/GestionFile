<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Information</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/libs/materialize.min.css') }}">
    {# CSS par défaut pour être sûr d'avoir quelque chose #}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/phone.css') }}">
    {# Les surcharges personnalisées sont chargées après #}
    <link rel="stylesheet" href="{{ get_css_url(mode='phone') }}">
    <script src="{{ url_for('static', filename='js/libs/htmx.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/libs/socket.io.min.js') }}"></script>
</head>
<body>

    <div class="container">

        <div id="div_title_area">
            <h1 id="text_title">{{phone_title}}</h1>
        </div>
        <div id="div_infos"
            data-activity-id="{{ activity_id }}"
            data-language-code="{{ language_code }}"
            hx-trigger="load"
            hx-post="/patient/phone/ping"
            hx-swap="outerHTML"
            hx-vals='{"activity_id": "{{ activity_id }}", "language_code": "{{language_code}}"}'> 

            <p>En attente de validation pour le numéro {{ patient_id }}</p>
            <p>Veuillez patienter....</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/phone.js') }}"></script>

</body>
</html>
