<!-- Structure de Swiper -->
<div class="swiper" data-swiper-delay="{{ time }}"
     data-swiper-effect="{{announce_infos_transition}}"
     style="width: {{announce_infos_width}}px; height: {{announce_infos_height}}px;">
    <div class="swiper-wrapper">
        <!-- Images ajoutées dynamiquement -->

        {% for image in images %}
        <div class="swiper-slide">
            <img src="{{ image }}" alt="Slide image">
        </div>
        {% endfor %}
    </div>
</div>
