<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>{% block title %}{% endblock %} · Flowelis</title>
    {% include 'shared/_favicon.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/libs/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/libs/bootstrap-icons/font/bootstrap-icons.min.css') }}">
</head>
<body class="bg-body-tertiary">
    <main class="container py-5" style="max-width: 30rem;">
        <img src="{{ url_for('static', filename='images/flowelis-horizontal-couleur.svg') }}"
             alt="Flowelis" height="40" class="d-block mb-4">
        <h1 class="h3 mb-4">{% block heading %}{% endblock %}</h1>
        {% block content %}{% endblock %}
        <p class="mt-4 small"><a href="{{ url_for('admin_security.login') }}">← Retour à la connexion</a></p>
    </main>
</body>
</html>
