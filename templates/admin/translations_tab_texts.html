<h4>Choix de la langue</h4>
<div class="input-field">
    <select class="form-select"
    id="language_target"
    hx-trigger="change"
    hx-post="/admin/translations/change_language_target"
    hx-target="#translations_list"
    data-param-language_code="#language_target"
    >
        <option value="" disabled selected>Choix de la langue cible</option>
        {% for language in languages %}
            {% if language.code != 'fr' %}
                <option value="{{ language.code }}">
                    {{ language.name.capitalize() }}
                </option>
            {% endif %}
        {% endfor %}
    </select>
</div>

<div id="translations_list"></div>

<button type="button"
    class="btn btn-primary"
    hx-post="/admin/translations/collect"
    hx-target="#invisible"
    data-param-language_code="#language_target">
    Mettre les textes à jour
</button>
