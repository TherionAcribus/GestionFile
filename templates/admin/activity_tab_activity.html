<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
    <p class="text-muted mb-0">Chaque carte résume l'activité ; « Modifier » ouvre tous ses réglages.</p>
    <button type="button" class="btn btn-primary"
            hx-get="/admin/activity/add_form"
            hx-target="#div_add_activity_form"
            hx-swap="innerHTML show:#div_add_activity_form:top">
        <i class="bi bi-plus-lg" aria-hidden="true"></i> Nouvelle activité
    </button>
</div>

<div id="div_add_activity_form"></div>

<input type="search" class="form-control table-filter mb-2"
       placeholder="Rechercher une activité…"
       aria-label="Filtrer la liste des activités"
       data-filter-target="#div_activity_table">

<div id="div_activity_table"
    hx-get="/admin/activity/table"
    hx-trigger="load, refresh_activity_table"
    hx-target="#div_activity_table"
    hx-swap="innerHTML">
    <p class="text-muted small">Chargement…</p>
</div>

{{ macros.backup_buttons("activities", "Activités") }}
