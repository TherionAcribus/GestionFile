{% extends '/admin/base.html' %}

{% block title %}Admin{% endblock %}

{% block content %}
    <h3>Admin</h3>

    <h4>Choix de la palette de couleurs</h4>
    <div class="input-field">
        <select class="form-select"
        id="admin_colors"
        hx-post="/admin/update_select"
        hx-target="#invisible"
        hx-vals='{"key": "admin_colors"}'
        data-param-value="#admin_colors">
            <option value="" disabled selected>Palette de couleurs</option>
            {% for theme in themes %}
            <option value="{{ theme }}" 
                {{ 'selected' if admin_colors == theme else '' }}>
                {{ theme.capitalize() }}
            </option>
            {% endfor %}
        </select>
    </div>
    <p>Les palettes de couleurs sont issues de <a href="https://bootswatch.com/" target="_blank">Bootswatch</a></p>

    
{% endblock %}
