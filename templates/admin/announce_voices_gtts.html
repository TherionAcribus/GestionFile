<label for="gtts_voice" class="form-label">Voix gTTS</label>
<select
    class="form-select"
    id="gtts_voice"
    name="gtts_voice"
    hx-post="/admin/announce/save_gtts_voice"
    hx-target="#invisible"
    hx-vals='{"language_id": {{ language.id }}}'
    data-param-gtts_voice_name="#gtts_voice">
    {# Sans voix enregistrée, le moteur utilise le code de la langue
       (cf. create_tts_sound) : on l'affiche comme sélection. #}
    {% set gtts_current = language.voice_gtts_name or language.code %}
    {% if gtts_current not in gtts_languages %}
    <option value="" disabled selected>— Choisir une voix —</option>
    {% endif %}
    {% for lang_code, lang_name in gtts_languages.items() %}
        <option value="{{ lang_code }}" {% if gtts_current == lang_code %}selected{% endif %}>
            {{ lang_name }} ({{ lang_code }})
        </option>
    {% endfor %}
</select>
<div class="form-text">Enregistré dès la sélection.</div>
