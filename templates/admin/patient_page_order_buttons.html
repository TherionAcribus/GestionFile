<h3>Choix de l'ordre des boutons</h3>
<p>Glissez-déposez les boutons dans l'ordre souhaite, ou utilisez les flèches haut/bas et les boutons « Monter »/« Descendre ».</p>
<ul id="list_order_buttons" class="list-group" role="list">
    {% for button in buttons %}
    <li class="button-order-item list-group-item" data-id="{{ button.id }}" role="listitem" tabindex="0">
        {{ button.label }}
    </li>
    {% endfor %}
</ul>
<button id="saveOrderButton"
        class='btn btn-primary'
        hx-post="/admin/patient/update_button_order"
        hx-target="#invisible"
        hx-vals="js:{'order[]': Array.from(document.querySelectorAll('.button-order-item')).map(item => item.getAttribute('data-id'))}"
        >Sauvegarder l'ordre</button>
