<div class="card border-primary mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <strong>Nouveau comptoir</strong>
        {# Vide le conteneur sans requête serveur (admin_fragments.js). #}
        <button type="button" class="btn-close" aria-label="Fermer le formulaire"
                data-clear-target="#div_add_counter_form"></button>
    </div>
    <div class="card-body">
        <form class="d-flex flex-wrap align-items-end gap-2"
              hx-post="/admin/counter/add_new_counter"
              hx-target="#div_counter_table" hx-swap="innerHTML">
            <div>
                <label class="form-label" for="new_counter_name">Nom affiché</label>
                <input type="text" class="form-control" id="new_counter_name" name="name"
                       maxlength="20" required placeholder="Ex. : 3 ou Comptoir 3">
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg" aria-hidden="true"></i> Créer</button>
        </form>
        <p class="form-text mb-0">
            Aucun autre réglage : les patients appelés dépendent de la personne qui se connecte au comptoir
            (ses compétences, page <a href="/admin/staff">Équipe</a>).
        </p>
    </div>
</div>
