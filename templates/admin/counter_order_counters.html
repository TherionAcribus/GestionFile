<h3>Choix des comptoirs</h3>
<p>Glissez-déposez les comptoirs dans l'ordre souhaite, ou utilisez les flèches haut/bas et les boutons « Monter »/« Descendre ».</p>
<ul id="list_order_buttons" class="list-group" role="list">
    {% for counter in counters %}
    <li class="button-order-item list-group-item" data-id="{{ counter.id }}" role="listitem" tabindex="0">
        {{ counter.name }}
    </li>
    {% endfor %}
</ul>
<button id="saveOrderCounterButton"
        class="btn btn-primary"
        hx-post="/admin/counter/update_counter_order"
        hx-target="#invisible"
        hx-vals="js:{'order[]': Array.from(document.querySelectorAll('.button-order-item')).map(item => item.getAttribute('data-id'))}"
        >Sauvegarder l'ordre</button>
