<div class="mb-3">
    <label for="pwd_change_1" class="form-label">Nouveau mot de passe</label>
    <div class="input-group">
        <input type="password" class="form-control" id="pwd_change_1" required>
        <button type="button" class="btn btn-outline-secondary" data-toggle-password="#pwd_change_1" aria-label="Afficher le mot de passe"><i class="bi bi-eye"></i></button>
    </div>
    <div class="form-text">Au moins 10 caractères, évitez les mots de passe courants.</div>
</div>
<div class="mb-3">
    <label for="pwd_change_2" class="form-label">Confirmer le mot de passe</label>
    <div class="input-group">
        <input type="password" class="form-control" id="pwd_change_2" required>
        <button type="button" class="btn btn-outline-secondary" data-toggle-password="#pwd_change_2" aria-label="Afficher le mot de passe"><i class="bi bi-eye"></i></button>
    </div>
</div>

{% if not is_self %}
<div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="pwd_change_must" checked>
    <label class="form-check-label" for="pwd_change_must">
        L'obliger à choisir son propre mot de passe à sa prochaine connexion
    </label>
    <div class="form-text">Recommandé : vous lui communiquez ce mot de passe temporaire, il le remplace aussitôt.</div>
</div>
{% endif %}

<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
    <button type="button" class="btn btn-primary"
        hx-post="/admin/security/update_password/{{ user_id }}"
        hx-target="#div_user_table"
        data-param-password1="#pwd_change_1"
        data-param-password2="#pwd_change_2"
        {% if not is_self %}data-param-must_change="#pwd_change_must@checked"{% endif %}
        data-param-search="#users-search"
        data-param-per_page="#users-per_page"
        data-param-sort="#users-sort"
        data-param-dir="#users-dir">
        Enregistrer
    </button>
</div>
