{% from 'admin/_dashboard_cards.html' import card_shell %}
{% call card_shell(dashboardcard, badge=total) %}
<ul class="list-unstyled mb-0">
    {% for row in rows %}
    <li class="d-flex align-items-center py-1 {{ '' if row.count else 'text-muted' }}">
        <i class="bi bi-circle-fill me-2 small {{ 'text-success' if row.count else 'text-body-tertiary' }}" aria-hidden="true"></i>
        {{ row.label }}
        <span class="ms-auto fw-semibold">{{ row.count }}</span>
    </li>
    {% endfor %}
</ul>
{% endcall %}
